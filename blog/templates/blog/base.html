{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Django Girls blog</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext">
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">
    </head>
<body>
    <header class="page-header">
      <div class="container">
        <h1><a href="/">Django Girls Blog</a></h1>
      </div>
{% if user.is_authenticated %}
<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <span>Hi, {{ user.username }} |</span>
    <button type="submit" class="btn btn-primary" style="background-color: green;">Logout</button>
</form>
{% else %}
    <a class='btn btn-primary' href="{% url 'login' %}" style="background-color: green;">Login</a>
    <a class='btn btn-primary' href="{% url 'signup' %}" style="background-color: green;">Sign up</a>
{% endif %}
{% if user.is_authenticated %}
        <a href="{% url 'post_new' %}" class="top-menu">
    {% include './icons/file-earmark-plus.svg' %}
    </a>
{% endif %}
    </header>
    <main class="container">
        <div class="row">
            <div class="col">
            {% block content %}
            {% endblock %}
            </div>
        </div>
    </main>
</body>
</html>
